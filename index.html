  <link rel="stylesheet" href="css/style.css" />
  <style>
    .hero {
      background: linear-gradient(135deg, #F0F3FF 0%, #E8FDF9 100%);
      padding: 6rem 2rem 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(79,110,247,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,201,167,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(79,110,247,0.2);
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .hero-eyebrow .dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }
    .hero h1 {
      font-size: 3.5rem;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }
    .hero h1 .highlight { color: var(--primary); position: relative; }
    .hero h1 .highlight::after {
      content: '';
      position: absolute;
      bottom: 4px; left: 0;
      width: 100%; height: 6px;
      background: var(--accent);
      opacity: 0.3;
      border-radius: 3px;
    }
    .hero p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
    }
    .hero-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin-top: 4rem;
      padding-top: 3rem;
      border-top: 1px solid rgba(79,110,247,0.15);
    }
    .stat { text-align: center; }
    .stat-number { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700; color: var(--primary); display: block; }
    .stat-label { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.2rem; }
    .course-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); transition: all 0.25s; }
    .course-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
    .course-thumb { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .thumb-blue { background: linear-gradient(135deg, #EEF1FE, #D4DDFC); }
    .thumb-green { background: linear-gradient(135deg, #E0FAF5, #B2F0E5); }
    .thumb-orange { background: linear-gradient(135deg, #FFF3E0, #FFE0B2); }
    .thumb-purple { background: linear-gradient(135deg, #F3E8FF, #E0C3FC); }
    .thumb-red { background: linear-gradient(135deg, #FEE2E2, #FECACA); }
    .thumb-teal { background: linear-gradient(135deg, #E0FEFE, #B2EFEF); }
    .course-body { padding: 1.25rem; }
    .course-body h3 { font-size: 1rem; margin: 0.5rem 0 0.4rem; }
    .course-body p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1rem; }
    .course-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .feature-card { padding: 1.75rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); transition: all 0.2s; }
    .feature-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .feature-icon { font-size: 2rem; margin-bottom: 1rem; display: block; }
    .feature-card h3 { font-size: 1.05rem; margin-bottom: 0.5rem; }
    .feature-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
    .cta-section { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; text-align: center; padding: 5rem 2rem; }
    .cta-section h2 { font-size: 2.5rem; margin-bottom: 1rem; color: #fff; }
    .cta-section p { font-size: 1.1rem; opacity: 0.85; max-width: 500px; margin: 0 auto 2.5rem; }
    .btn-white { background: #fff; color: var(--primary); font-family: 'Space Grotesk', sans-serif; font-weight: 700; padding: 0.85rem 2rem; border-radius: var(--radius-sm); font-size: 1rem; display: inline-block; transition: all 0.2s; }
    .btn-white:hover { background: var(--primary-light); transform: translateY(-2px); }
    .testimonial-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.75rem; box-shadow: var(--shadow); }
    .testimonial-text { font-size: 0.95rem; color: var(--text); line-height: 1.7; margin-bottom: 1.25rem; font-style: italic; }
    .testimonial-author { display: flex; align-items: center; gap: 0.75rem; }
    .author-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: #fff; }
    .avatar-blue { background: var(--primary); }
    .avatar-green { background: var(--accent); }
    .avatar-purple { background: #8B5CF6; }
    .author-info strong { display: block; font-size: 0.9rem; font-family: 'Space Grotesk', sans-serif; }
    .author-info span { font-size: 0.8rem; color: var(--text-muted); }
    .stars { color: #F59E0B; font-size: 0.85rem; margin-bottom: 0.75rem; }
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.2rem; }
      .hero-stats { gap: 1.5rem; flex-wrap: wrap; }
      .stat-number { font-size: 1.5rem; }
    }
  </style>
</head>
