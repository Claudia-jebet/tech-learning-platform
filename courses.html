  <link rel="stylesheet" href="css/style.css" />
  <style>
    .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .filter-btn { padding: 0.45rem 1.1rem; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
    .filter-btn:hover, .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .course-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); transition: all 0.25s; display: flex; flex-direction: column; }
    .course-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
    .course-thumb { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .thumb-blue { background: linear-gradient(135deg, #EEF1FE, #D4DDFC); }
    .thumb-green { background: linear-gradient(135deg, #E0FAF5, #B2F0E5); }
    .thumb-orange { background: linear-gradient(135deg, #FFF3E0, #FFE0B2); }
    .thumb-purple { background: linear-gradient(135deg, #F3E8FF, #E0C3FC); }
    .thumb-red { background: linear-gradient(135deg, #FEE2E2, #FECACA); }
    .thumb-teal { background: linear-gradient(135deg, #E0FEFE, #B2EFEF); }
    .thumb-yellow { background: linear-gradient(135deg, #FFFDE7, #FFF9C4); }
    .thumb-pink { background: linear-gradient(135deg, #FCE4EC, #F8BBD9); }
    .thumb-indigo { background: linear-gradient(135deg, #E8EAF6, #C5CAE9); }
    .course-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .course-body h3 { font-size: 1rem; margin: 0.5rem 0 0.4rem; }
    .course-body p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; flex: 1; margin-bottom: 1rem; }
    .course-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .course-link { display: block; text-align: center; margin: 1rem 1.25rem 1.25rem; padding: 0.6rem; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 600; transition: all 0.2s; }
    .course-link:hover { background: var(--primary); color: #fff; }
    .courses-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    @media (max-width: 768px) { .courses-grid { grid-template-columns: 1fr; } }
  </style>
</head>
