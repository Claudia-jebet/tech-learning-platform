  <style>
    .mission-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
    .mission-visual { background: linear-gradient(135deg, var(--primary-light), var(--accent-light)); border-radius: var(--radius-lg); padding: 3rem; text-align: center; font-size: 5rem; line-height: 1.4; }
    .mission-content h2 { font-size: 2rem; margin-bottom: 1rem; }
    .mission-content p { color: var(--text-muted); line-height: 1.8; margin-bottom: 1rem; font-size: 0.975rem; }
    .value-item { display: flex; gap: 1.25rem; padding: 1.5rem; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1rem; transition: all 0.2s; }
    .value-item:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .value-icon { font-size: 1.75rem; flex-shrink: 0; margin-top: 0.1rem; }
    .value-item h3 { font-size: 1rem; margin-bottom: 0.3rem; }
    .value-item p { font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; }
    .team-card { text-align: center; padding: 2rem 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); transition: all 0.2s; }
    .team-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: var(--shadow-hover); }
    .team-avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: #fff; margin: 0 auto 1rem; }
    .team-card h3 { font-size: 1rem; margin-bottom: 0.2rem; }
    .team-card .role { font-size: 0.8rem; color: var(--primary); font-weight: 600; margin-bottom: 0.5rem; }
    .team-card p { font-size: 0.825rem; color: var(--text-muted); line-height: 1.5; }
    .stats-banner { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 3.5rem 2rem; color: #fff; }
    .stats-banner-grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; text-align: center; }
    .stats-banner-grid .num { font-family: 'Space Grotesk', sans-serif; font-size: 2.25rem; font-weight: 700; display: block; }
    .stats-banner-grid .lbl { font-size: 0.85rem; opacity: 0.8; margin-top: 0.25rem; }
    @media (max-width: 768px) { .mission-grid { grid-template-columns: 1fr; gap: 2rem; } .stats-banner-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>

          <h2>Closing the Tech Skills Gap in Africa</h2>
          <p>Tech is one of the fastest-growing industries in the world — but access to quality, structured learning still isn't equal. TechLearn was founded to change that.</p>
          <p>We started as a small team of developers and educators who saw how much potential existed in African students and professionals — and how many lacked a clear, affordable path to build tech skills.</p>
          <p>Today, TechLearn serves thousands of learners across Kenya and the wider African continent.</p>
