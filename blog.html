    .blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.75rem; }

    .blog-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .blog-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.6rem; display: flex; gap: 0.75rem; align-items: center; }
    .blog-body h3 { font-size: 1rem; margin-bottom: 0.5rem; line-height: 1.4; }
    .blog-body p { font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; flex: 1; margin-bottom: 1rem; }
    .blog-read-more { font-size: 0.85rem; font-weight: 600; color: var(--primary); display: inline-flex; align-items: center; gap: 0.3rem; transition: gap 0.2s; }
    .blog-card:hover .blog-read-more { gap: 0.6rem; }
    .featured-post { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 3rem; }
    .featured-thumb { background: linear-gradient(135deg, var(--primary-light), var(--accent-light)); display: flex; align-items: center; justify-content: center; font-size: 6rem; min-height: 280px; }
    .featured-body { padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; }
    .featured-body h2 { font-size: 1.6rem; margin-bottom: 0.75rem; line-height: 1.3; }
    .featured-body p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 1.5rem; }
    @media (max-width: 768px) { .blog-grid { grid-template-columns: 1fr; } .featured-post { grid-template-columns: 1fr; } .featured-thumb { min-height: 160px; } }
